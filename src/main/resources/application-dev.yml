# ==================== Dev Profile Overrides ====================
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ==================== Detailed Logging ====================
logging:
  level:
    com.isaralert: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
